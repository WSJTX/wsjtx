name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    # `labeled` is added to the defaults (opened/synchronize/reopened) so
    # that applying the `full-ci` label to an already-open PR triggers a
    # fresh run that includes the expensive matrix (see the gate below).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the project version string: read it from
  # CMakeLists.txt so CI and release.yml cannot disagree. Strip the
  # optional fourth tweak segment (3.0.0.0 → 3.0.0) to match the 3-part
  # shape release.yml derives from build/v<X.Y.Z> tags.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          VERSION=$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}' | cut -d. -f1-3)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Derived version from CMakeLists.txt: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Two-tier CI to conserve Action minutes. Roughly 95% of the bill is the
  # macOS (10x) and Windows (2x) legs; both Linux legs bill at 1x.
  #
  #   * Default (every push / PR to develop): Linux only -- `linux` (x86_64)
  #     plus `linux-arm` (aarch64, native ubuntu-24.04-arm). Fast, cheap, and
  #     catches the large majority of breakage.
  #   * Expensive matrix (macos, macos-intel, windows): opt-in only. Runs when
  #     a PR carries the `full-ci` label, or when the workflow is started
  #     manually ("Run workflow" / workflow_dispatch). Release builds are
  #     unaffected -- they run the full matrix via release.yml on build/v* tags.
  #
  # Every non-prepare leg also `needs: linux`, so a break that fails
  # everywhere fails fast on the cheapest runner before any costly leg
  # starts, instead of burning them in parallel. `prepare` stays in `needs`
  # for its version output.
  macos:
    needs: [prepare, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"
    secrets: inherit

  macos-intel:
    needs: [prepare, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
    secrets: inherit

  linux-arm:
    needs: [prepare, linux]
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "aarch64"
    secrets: inherit

  windows:
    needs: [prepare, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
    secrets: inherit
