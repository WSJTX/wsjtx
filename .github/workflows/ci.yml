name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    # `labeled` is added to the defaults (opened/synchronize/reopened) so
    # that applying `full-ci` or `sanitizers` to an already-open PR triggers
    # a fresh run that includes the requested opt-in jobs (see the gates below).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single source of truth for the project version string: read it from
  # CMakeLists.txt so CI and release.yml cannot disagree. Strip the
  # optional fourth tweak segment (3.0.0.0 → 3.0.0) to match the 3-part
  # shape release.yml derives from build/v<X.Y.Z> tags.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          VERSION=$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}' | cut -d. -f1-3)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Derived version from CMakeLists.txt: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  detect-build-system-changes:
    runs-on: ubuntu-latest
    outputs:
      recache: ${{ steps.detect.outputs.recache }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: detect
        name: Detect build-system changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE_RECACHE: ${{ inputs.recache || false }}
        run: .github/scripts/detect-ccache-recache.sh

  # Two-tier CI to conserve Actions minutes. The default path runs one Linux
  # x86_64 smoke leg; sanitizer and broader platform coverage are opt-in.
  #
  #   * Default (every push / PR to develop): Linux x86_64 only -- `linux`.
  #   * ASan + UBSan: runs on PRs carrying `sanitizers` or `full-ci`.
  #   * TSan: runs only on PRs carrying `sanitizers`.
  #   * Opt-in matrix (`linux-arm`, macos, macos-intel, windows): runs when a
  #     PR carries the `full-ci` label, or when the workflow is started manually
  #     ("Run workflow" / workflow_dispatch). Release builds are unaffected --
  #     they run the full matrix via release.yml on build/v* tags.
  #
  # Every non-prepare leg also `needs: linux`, so a break that fails
  # everywhere fails fast on the cheapest runner before any costly leg
  # starts, instead of burning them in parallel. `prepare` stays in `needs`
  # for its version output.
  macos:
    needs: [prepare, detect-build-system-changes, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  macos-intel:
    needs: [prepare, detect-build-system-changes, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  linux:
    needs: [prepare, detect-build-system-changes]
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  linux-sanitizers:
    name: Linux x86_64 ASan + UBSan
    needs: [prepare, detect-build-system-changes, linux]
    if: >-
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      contains(github.event.pull_request.labels.*.name, 'sanitizers')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-linux-sanitizers
        with:
          hamlib_branch: "4.7.2"
          sanitizer: asan-ubsan
          recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}

  linux-tsan:
    name: Linux x86_64 TSan
    needs: [prepare, detect-build-system-changes, linux]
    if: contains(github.event.pull_request.labels.*.name, 'sanitizers')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-linux-sanitizers
        with:
          hamlib_branch: "4.7.2"
          sanitizer: tsan
          recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}

  linux-arm:
    needs: [prepare, detect-build-system-changes, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "aarch64"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  windows:
    needs: [prepare, detect-build-system-changes, linux]
    # Opt-in only -- see the two-tier note above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit
