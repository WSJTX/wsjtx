name: Build Linux

on:
  workflow_call:
    inputs:
      version:
        description: "WSJT-X version string"
        required: true
        type: string
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.2"
      arch:
        description: "Linux target architecture: x86_64, aarch64, or armhf"
        required: false
        type: string
        default: "x86_64"
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Immutable GHCR image tag; empty resolves the current validated generation"
        required: false
        type: string
        default: ""
      allow_stale_image:
        description: "Allow a previously promoted image when a dependency refresh changed the recipe"
        required: false
        type: boolean
        default: false
      save_ccache:
        description: "Save compiled objects for trusted builds"
        required: false
        type: boolean
        default: false
      release_channel:
        description: "Build release channel: DEVEL, RC, or GA"
        required: false
        type: string
        default: "DEVEL"
      rc_number:
        description: "Release candidate number when release_channel is RC"
        required: false
        type: string
        default: ""
  # Also runnable on its own ("Run workflow" / gh workflow run) to build a single
  # Linux arch without dispatching the full ci.yml matrix. GitHub only exposes
  # workflow_dispatch when the trigger is on the default branch (develop), so this
  # must be merged before it can be dispatched. The primary use case is the armhf
  # leg, which is intentionally NOT in ci.yml's PR matrix (~50–80 min QEMU wall-
  # clock is too high per-PR) — dispatch it on demand. Inputs mirror workflow_call
  # with standalone defaults: hamlib_branch matches what ci.yml / release.yml pass
  # (4.7.2), and version is overridable via `-f version=...`.
  workflow_dispatch:
    inputs:
      version:
        description: "WSJT-X version string (artifact + package names)"
        required: false
        type: string
        default: "3.2.0-devel"
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.2"
      arch:
        description: "Linux target architecture"
        required: false
        type: choice
        options:
          - x86_64
          - aarch64
          - armhf
        default: "x86_64"
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Immutable GHCR image tag; empty resolves the current validated generation"
        required: false
        type: string
        default: ""
      allow_stale_image:
        description: "Allow a previously promoted image when a dependency refresh changed the recipe"
        required: false
        type: boolean
        default: false
      save_ccache:
        description: "Save compiled objects"
        required: false
        type: boolean
        default: false
      release_channel:
        description: "Build release channel"
        required: false
        type: choice
        options:
          - DEVEL
          - RC
          - GA
        default: "DEVEL"
      rc_number:
        description: "Release candidate number when release_channel is RC"
        required: false
        type: string
        default: ""

# Three jobs gated on `inputs.arch`. Each call from ci.yml / release.yml passes
# a single `arch:` value, so exactly one job runs per call. Splitting on arch
# keeps the per-arch runtime profile explicit at the job level:
#
#   x86_64 — validated Noble container on ubuntu-24.04.
#   aarch64 — validated GCC 13.4 Bookworm container on ubuntu-24.04-arm. This keeps the
#            Bookworm glibc 2.36 + pre-t64 library baseline while using GCC 13
#            (issue #49).
#   armhf  — validated GCC 13.4 Bookworm arm/v7 container via QEMU
#            user-mode emulation (issue #51). DigiPi / Pi Zero 2W class.
#            See the build-armhf job below for the QEMU + --platform recipe.
#
# All three jobs share a single composite action (`.github/actions/build-linux-
# payload`) so the build pipeline lives in one place; the only diff between
# jobs is architecture + (for armhf) the QEMU bootstrap.

permissions:
  contents: read
  packages: read

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          ARMHF_BUILD: ${{ inputs.arch == 'armhf' }}
        shell: bash
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            IMAGE_TAG="$REQUESTED_TAG" .github/scripts/validate-ci-inputs.sh
            echo "image_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$ARMHF_BUILD" = true ]; then
            RESOLVE_ARMHF=true .github/scripts/resolve-linux-ci-image-tag.py
          else
            .github/scripts/resolve-linux-ci-image-tag.py
          fi

  build-x86_64:
    needs: resolve-image
    if: inputs.arch == 'x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    container:
      image: ghcr.io/wsjtx/wsjtx-internal/linux-noble:${{ needs.resolve-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow inputs
        env:
          WSJTX_VERSION: ${{ inputs.version }}
          HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
          WSJT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          WSJT_RC_NUMBER: ${{ inputs.rc_number }}
          ARCH: ${{ inputs.arch }}
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image_tag }}
        run: .github/scripts/validate-ci-inputs.sh
      - uses: ./.github/actions/build-linux-payload
        with:
          arch: x86_64
          version: ${{ inputs.version }}
          hamlib_branch: ${{ inputs.hamlib_branch }}
          runtime_base: host
          recache: ${{ inputs.recache }}
          save_ccache: ${{ inputs.save_ccache }}
          release_channel: ${{ inputs.release_channel }}
          rc_number: ${{ inputs.rc_number }}
          allow_stale_image: ${{ inputs.allow_stale_image }}

  build-aarch64:
    needs: resolve-image
    if: inputs.arch == 'aarch64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # The official GCC image adds GCC 13.4 without moving off the Bookworm
    # glibc 2.36 and pre-t64 runtime baseline (issue #49).
    container:
      image: ghcr.io/wsjtx/wsjtx-internal/linux-arm64-bookworm:${{ needs.resolve-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow inputs
        env:
          WSJTX_VERSION: ${{ inputs.version }}
          HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
          WSJT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          WSJT_RC_NUMBER: ${{ inputs.rc_number }}
          ARCH: ${{ inputs.arch }}
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image_tag }}
        run: .github/scripts/validate-ci-inputs.sh
      - uses: ./.github/actions/build-linux-payload
        with:
          arch: aarch64
          version: ${{ inputs.version }}
          hamlib_branch: ${{ inputs.hamlib_branch }}
          runtime_base: bookworm-gcc13.4
          recache: ${{ inputs.recache }}
          save_ccache: ${{ inputs.save_ccache }}
          release_channel: ${{ inputs.release_channel }}
          rc_number: ${{ inputs.rc_number }}
          allow_stale_image: ${{ inputs.allow_stale_image }}

  build-armhf:
    needs: resolve-image
    if: inputs.arch == 'armhf'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 160
    # 32-bit ARM (armhf) runtime for DigiPi / Raspberry Pi Zero 2W class
    # (issue #51). Builds inside the validated GCC Bookworm arm/v7 image on the aarch64
    # ubuntu-24.04-arm runner via QEMU user-mode emulation.
    #
    # NOTE on architecture (different from x86_64/aarch64): this job does
    # NOT use a job-level `container:` directive. Why: GHA mounts its
    # actions runtime (an aarch64 node binary at /__e/node20/bin/node)
    # into the job container, and inside an arm/v7 container the aarch64
    # dynamic loader (/lib/ld-linux-aarch64.so.1) is absent — every JS
    # action (setup-qemu-action, actions/checkout, actions/cache, upload-
    # artifact, AND a `uses:` invocation of the composite action itself)
    # fails with `exec /__e/node20/bin/node: no such file or directory`.
    # See run 25449706167 for the empirical confirmation. The fix: run
    # the JOB on the host (where JS actions work natively against the
    # aarch64 host node) and explicitly `docker run --platform linux/arm/v7`
    # the build payload as a single bash script. Composite action remains
    # source-of-truth for x86_64+aarch64; .github/scripts/build-linux-
    # payload.sh mirrors its bash bodies for the armhf path. Documenting
    # so the diff vs build-aarch64 (which DOES use `container:`) doesn't
    # read as inconsistent.
    #
    # Wall-clock budget: about 105 min observed under QEMU vs ~10 min native. Asymmetric
    # CI gating (NOT in PR matrix; tags + workflow_dispatch only) — see
    # release.yml for the production wiring.
    env:
      VERSION: ${{ inputs.version }}
      HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
      WSJT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
      WSJT_RC_NUMBER: ${{ inputs.rc_number }}
    steps:
      # setup-qemu-action runs on the host (job has no `container:`),
      # mutating the host kernel's binfmt_misc table. With arm/v7
      # registered, subsequent `docker run --platform linux/arm/v7`
      # invocations execute the container's arm/v7 init + binaries via
      # qemu-arm-static.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm/v7
      - uses: actions/checkout@v7
      - name: Validate workflow inputs
        env:
          WSJTX_VERSION: ${{ inputs.version }}
          HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
          WSJT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          WSJT_RC_NUMBER: ${{ inputs.rc_number }}
          ARCH: armhf
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image_tag }}
        run: .github/scripts/validate-ci-inputs.sh

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect armhf image
        id: image
        env:
          BUILDER_IMAGE: ghcr.io/wsjtx/wsjtx-internal/linux-armv7-bookworm:${{ needs.resolve-image.outputs.image_tag }}
        run: |
          docker pull --platform linux/arm/v7 "$BUILDER_IMAGE"
          toolchain_id="$(docker run --rm --platform linux/arm/v7 "$BUILDER_IMAGE" \
            bash -c '. /opt/wsjtx-ci/image.env; printf "%s" "$toolchain_id"')"
          if [ -z "$toolchain_id" ]; then
            echo "::error::armhf image did not provide a toolchain identity"
            exit 1
          fi
          echo "toolchain_id=$toolchain_id" >> "$GITHUB_OUTPUT"

      - name: Restore armhf ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache-armhf
          key: ccache-linux-armhf-${{ steps.image.outputs.toolchain_id }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-armhf-${{ steps.image.outputs.toolchain_id }}-

      - name: Build inside arm/v7 Bookworm GCC image
        env:
          ARCH: armhf
          BUILDER_IMAGE: ghcr.io/wsjtx/wsjtx-internal/linux-armv7-bookworm:${{ needs.resolve-image.outputs.image_tag }}
        run: |
          GITHUB_TOKEN="${{ github.token }}" docker run --rm --platform linux/arm/v7 \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e VERSION \
            -e HAMLIB_BRANCH \
            -e ARCH \
            -e WSJT_RELEASE_CHANNEL \
            -e WSJT_RC_NUMBER \
            -e GITHUB_TOKEN \
            -e CCACHE_DIR=/work/.ccache-armhf \
            "$BUILDER_IMAGE" \
            bash .github/scripts/build-linux-payload.sh

      # Artifacts produced inside the container land in $GITHUB_WORKSPACE
      # via the bind-mount. Upload from the host where actions/upload-
      # artifact runs natively. Same artifact names as the composite
      # action's uploads so release.yml's all-platforms-ready gate
      # pattern works unchanged.
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-linux-armhf-deb
          path: wsjtx-build/wsjtx-${{ inputs.version }}-linux-armhf.deb
          if-no-files-found: error
      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-linux-armhf-rpm
          path: wsjtx-build/*.rpm
          if-no-files-found: error
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-linux-armhf-AppImage
          path: wsjtx-${{ inputs.version }}-linux-armhf.AppImage
          if-no-files-found: error
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-linux-armhf
          path: |
            wsjtx-build/jt9
            wsjtx-build/wsprd
            wsjtx-build/wsjtx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-results-linux-armhf
          path: wsjtx-build/ctest-results.xml
          if-no-files-found: ignore

      - name: Save armhf ccache
        if: inputs.save_ccache && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ccache-armhf
          key: ${{ steps.ccache.outputs.cache-primary-key }}
