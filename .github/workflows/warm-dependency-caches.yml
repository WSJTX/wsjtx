name: Refresh Dependency Environments

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/build-linux.yml"
      - ".github/workflows/build-linux-sanitizers.yml"
      - ".github/workflows/publish-linux-ci-images.yml"
      - ".github/workflows/build-macos.yml"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/warm-dependency-caches.yml"
      - ".github/actions/build-linux-payload/**"
      - ".github/actions/build-linux-sanitizers/**"
      - ".github/images/linux-ci/**"
      - ".github/actions/warm-macos-deps/**"
      - ".github/actions/build-windows-deps/**"
      - ".github/scripts/build-*-linux.sh"
      - ".github/scripts/tsan-linux-deps-config.sh"
      - ".github/scripts/linux-ci-image-config.sh"
      - ".github/scripts/run-apt-get.sh"
      - ".github/scripts/verify-tsan-deps-linux.sh"
      - ".github/scripts/linux-ci-image-fingerprint.sh"
      - ".github/scripts/build-*-macos.sh"
      - ".github/scripts/build-*-windows.sh"
      - ".github/scripts/install-*-macos*.sh"
      - ".github/scripts/macos-qt-cache-key.sh"
      - ".github/scripts/verify-macos-*.sh"
  schedule:
    - cron: "23 10 * * 1"
    - cron: "17 9 1 * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "Dependency caches to warm"
        required: false
        type: choice
        options:
          - macos-arm64
          - macos-x86_64
          - macos
          - windows
          - linux
          - linux-tsan
          - linux-images
          - linux-retention
          - all
        default: macos-arm64
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      linux_images: ${{ steps.detect.outputs.linux_images }}
      retention: ${{ steps.detect.outputs.retention }}
      windows: ${{ steps.detect.outputs.windows }}
      macos_arm64: ${{ steps.detect.outputs.macos_arm64 }}
      macos_x86_64: ${{ steps.detect.outputs.macos_x86_64 }}
      include_tsan: ${{ steps.detect.outputs.include_tsan }}
      hamlib_branch: ${{ steps.detect.outputs.hamlib_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: detect
        name: Select cache warmers
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          TARGETS: ${{ inputs.targets || '' }}
          HAMLIB_BRANCH: ${{ inputs.hamlib_branch || '4.7.2' }}
        run: |
          set -euo pipefail
          .github/scripts/validate-ci-inputs.sh

          linux_images=false
          retention=false
          windows=false
          macos_arm64=false
          macos_x86_64=false
          include_tsan=false

          enable_cache_all() {
            windows=true
            macos_arm64=true
            macos_x86_64=true
          }

          enable_all() {
            linux_images=true
            retention=true
            enable_cache_all
          }

          case "$EVENT_NAME" in
            schedule)
              if [ "$SCHEDULE" = "17 9 1 * *" ]; then
                linux_images=true
                retention=true
                include_tsan=true
              else
                enable_cache_all
                retention=true
              fi
              ;;
            workflow_dispatch)
              case "$TARGETS" in
                all)
                  enable_all
                  ;;
                linux|linux-images)
                  linux_images=true
                  ;;
                linux-tsan)
                  linux_images=true
                  include_tsan=true
                  ;;
                linux-retention)
                  retention=true
                  ;;
                windows)
                  windows=true
                  ;;
                macos)
                  macos_arm64=true
                  macos_x86_64=true
                  ;;
                macos-arm64)
                  macos_arm64=true
                  ;;
                macos-x86_64)
                  macos_x86_64=true
                  ;;
                *)
                  echo "::error::Unsupported targets input: $TARGETS"
                  exit 2
                  ;;
              esac
              ;;
            push)
              if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                base="$BEFORE_SHA"
              else
                base="${CURRENT_SHA}^"
              fi

              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$base" || true
              fi

              if git cat-file -e "${base}^{commit}" 2>/dev/null; then
                changed="$(git diff --name-only "$base" "$CURRENT_SHA")"
              else
                echo "::notice::Could not compare $base..$CURRENT_SHA; warming all dependency caches"
                changed=""
                enable_all
              fi

              while IFS= read -r path; do
                [ -n "$path" ] || continue
                case "$path" in
                  .github/workflows/ci.yml|.github/workflows/release.yml)
                    enable_cache_all
                    ;;
                  .github/workflows/warm-dependency-caches.yml|.github/workflows/publish-linux-ci-images.yml|.github/workflows/build-linux.yml|.github/workflows/build-linux-sanitizers.yml|.github/actions/build-linux-payload/*|.github/actions/build-linux-sanitizers/*|.github/images/linux-ci/*|.github/scripts/linux-ci-image-config.sh|.github/scripts/build-pfunit-linux.sh|.github/scripts/build-hamlib-linux.sh|.github/scripts/build-*-tsan-linux.sh|.github/scripts/tsan-linux-deps-config.sh|.github/scripts/verify-tsan-deps-linux.sh)
                    linux_images=true
                    ;;
                  .github/scripts/run-apt-get.sh)
                    linux_images=true
                    ;;
                  .github/workflows/build-windows.yml|.github/actions/build-windows-deps/*|.github/scripts/build-boost-windows.sh|.github/scripts/build-pfunit-windows.sh|.github/scripts/build-hamlib-windows.sh)
                    windows=true
                    ;;
                  .github/workflows/build-macos.yml|.github/actions/warm-macos-deps/*|.github/scripts/build-*-macos.sh|.github/scripts/install-*-macos*.sh|.github/scripts/macos-qt-cache-key.sh|.github/scripts/verify-macos-*.sh)
                    macos_arm64=true
                    macos_x86_64=true
                    ;;
                esac
              done <<< "$changed"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 2
              ;;
          esac

          {
            echo "linux_images=$linux_images"
            echo "retention=$retention"
            echo "windows=$windows"
            echo "macos_arm64=$macos_arm64"
            echo "macos_x86_64=$macos_x86_64"
            echo "include_tsan=$include_tsan"
            echo "hamlib_branch=$HAMLIB_BRANCH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Dependency cache warmer selection"
            echo
            echo "| Target | Enabled |"
            echo "| --- | --- |"
            echo "| Linux GHCR images | $linux_images |"
            echo "| TSan GHCR image | $include_tsan |"
            echo "| Linux GHCR retention | $retention |"
            echo "| Windows x86_64 | $windows |"
            echo "| macOS arm64 | $macos_arm64 |"
            echo "| macOS x86_64 | $macos_x86_64 |"
          } >> "$GITHUB_STEP_SUMMARY"

  refresh-linux-images:
    needs: detect
    if: needs.detect.outputs.linux_images == 'true'
    uses: ./.github/workflows/publish-linux-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      promote: true
      include_tsan: ${{ needs.detect.outputs.include_tsan == 'true' }}
    secrets: inherit

  retain-linux-images:
    needs: [detect, refresh-linux-images]
    if: >-
      always() &&
      needs.detect.outputs.retention == 'true' &&
      (needs.refresh-linux-images.result == 'success' ||
       needs.refresh-linux-images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: linux-ci-image-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Apply GHCR retention
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          args=(
            --owner WSJTX
            --max-age-days 60
            --keep 3
            --package wsjtx-internal/linux-noble
            --package wsjtx-internal/linux-tsan-noble
            --package wsjtx-internal/linux-arm64-bookworm
            --package wsjtx-internal/linux-armv7-bookworm
          )
          if [ "$APPLY" = true ]; then
            args+=(--apply)
          fi
          .github/scripts/ghcr_retention.py "${args[@]}"

  warm-windows-x86_64:
    needs: detect
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Disable core.autocrlf before checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Boost is source-built by build-windows-deps so the Windows 7 API floor
      # and Boost.Atomic patch stay pinned; do not install MSYS2 Boost here.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make tar curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkg-config
            autoconf automake libtool

      - uses: ./.github/actions/build-windows-deps
        with:
          hamlib_branch: ${{ needs.detect.outputs.hamlib_branch }}
          save_caches: "true"

  warm-macos-arm64:
    needs: detect
    if: needs.detect.outputs.macos_arm64 == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/warm-macos-deps
        with:
          arch: arm64
          runner: macos-15
          deployment_target: "11.0"
          hamlib_branch: ${{ needs.detect.outputs.hamlib_branch }}

  warm-macos-x86_64:
    needs: detect
    if: needs.detect.outputs.macos_x86_64 == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/warm-macos-deps
        with:
          arch: x86_64
          runner: macos-15-intel
          deployment_target: "10.13"
          hamlib_branch: ${{ needs.detect.outputs.hamlib_branch }}
