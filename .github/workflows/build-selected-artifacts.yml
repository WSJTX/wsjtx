name: Build Selected Artifacts

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Artifact set to build"
        required: true
        type: choice
        options:
          - macos-arm64
          - windows-x64
          - macos-arm64-windows-x64
          - linux-x64
          - linux-arm64
          - macos-x64
          - all
        default: macos-arm64
      mode:
        description: "Build selected artifacts immediately or gate them on Linux x64 first"
        required: true
        type: choice
        options:
          - artifact-now
          - linux-smoke-first
        default: artifact-now
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.targets }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          VERSION=$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}' | cut -d. -f1-3)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Derived version from CMakeLists.txt: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  detect-build-system-changes:
    runs-on: ubuntu-latest
    outputs:
      recache: ${{ steps.detect.outputs.recache }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: detect
        name: Detect build-system changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE_RECACHE: ${{ inputs.recache || false }}
        run: |
          set -euo pipefail

          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            base="${CURRENT_SHA}^"
            head="$CURRENT_SHA"
          fi

          recache=false
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi

          if git cat-file -e "${base}^{commit}" 2>/dev/null && git cat-file -e "${head}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" "$head")"
          else
            echo "::notice::Could not compare $base..$head; forcing ccache recache"
            changed=""
            recache=true
          fi

          while IFS= read -r path; do
            case "$path" in
              CMakeLists.txt|*/CMakeLists.txt|*.cmake|cmake/*|CMake/*|.github/workflows/*.yml|.github/actions/build-*/*|.github/scripts/build-*.sh)
                recache=true
                ;;
            esac
          done <<< "$changed"

          if [ "$FORCE_RECACHE" = "true" ]; then
            recache=true
          fi

          echo "Build-system recache: $recache"
          echo "recache=$recache" >> "$GITHUB_OUTPUT"

  # In linux-smoke-first mode, this is both the cheap gate and a normal Linux
  # x64 artifact build. Do not also run linux-x64 for the same dispatch.
  linux-smoke-x64:
    needs: [prepare, detect-build-system-changes]
    if: inputs.mode == 'linux-smoke-first'
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  linux-x64:
    needs: [prepare, detect-build-system-changes]
    if: >-
      inputs.mode != 'linux-smoke-first' &&
      (inputs.targets == 'linux-x64' || inputs.targets == 'all')
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  linux-arm64:
    needs: [prepare, detect-build-system-changes, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.detect-build-system-changes.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (inputs.targets == 'linux-arm64' || inputs.targets == 'all')
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "aarch64"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  macos-arm64:
    needs: [prepare, detect-build-system-changes, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.detect-build-system-changes.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (
        inputs.targets == 'macos-arm64' ||
        inputs.targets == 'macos-arm64-windows-x64' ||
        inputs.targets == 'all'
      )
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  macos-x64:
    needs: [prepare, detect-build-system-changes, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.detect-build-system-changes.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (inputs.targets == 'macos-x64' || inputs.targets == 'all')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit

  windows-x64:
    needs: [prepare, detect-build-system-changes, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.detect-build-system-changes.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (
        inputs.targets == 'windows-x64' ||
        inputs.targets == 'macos-arm64-windows-x64' ||
        inputs.targets == 'all'
      )
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      recache: ${{ needs.detect-build-system-changes.outputs.recache == 'true' }}
    secrets: inherit
