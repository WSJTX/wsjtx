name: Build Selected Artifacts

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Artifact set to build"
        required: true
        type: choice
        options:
          - macos-arm64
          - windows-x64
          - macos-arm64-windows-x64
          - linux-x64
          - linux-arm64
          - macos-x64
          - all
        default: macos-arm64
      mode:
        description: "Build selected artifacts immediately or gate them on Linux x64 first"
        required: true
        type: choice
        options:
          - artifact-now
          - linux-smoke-first
        default: artifact-now
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Immutable Linux candidate/build image tag; empty uses the validated generation"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.targets }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      linux_image_tag: ${{ steps.linux-image.outputs.image_tag }}
      runtime_matrix: ${{ steps.runtime-matrix.outputs.matrix }}
      validate_linux: ${{ steps.runtime-matrix.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          STATE=$(python3 .github/scripts/release-policy.py read-state)
          VERSION=$(jq -r .version <<<"$STATE")
          echo "Derived version from release-state.txt: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: linux-image
        name: Resolve Linux CI image generation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            IMAGE_TAG="$REQUESTED_TAG" .github/scripts/validate-ci-inputs.sh
            if [[ ! "$REQUESTED_TAG" =~ ^(candidate-[0-9]+-[0-9]+|(validated-)?build-[0-9]{8}-[0-9]+-[0-9]+)$ ]]; then
              echo "::error::image_tag must identify an immutable candidate or build generation"
              exit 2
            fi
            echo "image_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/resolve-linux-ci-image-tag.py
          fi
      - id: runtime-matrix
        name: Select clean Linux installation checks
        env:
          TARGETS: ${{ inputs.targets }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import json
          import os
          rows = []
          targets = os.environ["TARGETS"]
          for arch, target, runner in (
              ("x86_64", "linux-x64", "ubuntu-24.04"),
              ("aarch64", "linux-arm64", "ubuntu-24.04-arm"),
          ):
              if targets not in (target, "all") and not (arch == "x86_64" and os.environ["MODE"] == "linux-smoke-first"):
                  continue
              images = [("ubuntu", "24.04", "deb"), ("ubuntu", "26.10", "deb"), ("fedora", "44", "rpm")]
              if arch == "aarch64":
                  images.append(("debian", "12", "deb"))
              for distro, version, package_format in images:
                  rows.append(dict(arch=arch, runner=runner, distro=f"{distro}-{version}",
                                   image=f"{distro}:{version}", format=package_format))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps({"include": rows}), file=output)
              print("enabled=" + str(bool(rows)).lower(), file=output)
          PY

  # In linux-smoke-first mode, this is both the cheap gate and a normal Linux
  # x64 artifact build. Do not also run linux-x64 for the same dispatch.
  linux-smoke-x64:
    needs: [prepare]
    if: inputs.mode == 'linux-smoke-first'
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      image_tag: ${{ needs.prepare.outputs.linux_image_tag }}
      save_ccache: true
      recache: ${{ inputs.recache }}

  linux-x64:
    needs: [prepare]
    if: >-
      inputs.mode != 'linux-smoke-first' &&
      (inputs.targets == 'linux-x64' || inputs.targets == 'all')
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      image_tag: ${{ needs.prepare.outputs.linux_image_tag }}
      save_ccache: true
      recache: ${{ inputs.recache }}

  linux-arm64:
    needs: [prepare, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (inputs.targets == 'linux-arm64' || inputs.targets == 'all')
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "aarch64"
      image_tag: ${{ needs.prepare.outputs.linux_image_tag }}
      save_ccache: true
      recache: ${{ inputs.recache }}

  macos-arm64:
    needs: [prepare, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (
        inputs.targets == 'macos-arm64' ||
        inputs.targets == 'macos-arm64-windows-x64' ||
        inputs.targets == 'all'
      )
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"
      recache: ${{ inputs.recache }}

  macos-x64:
    needs: [prepare, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (inputs.targets == 'macos-x64' || inputs.targets == 'all')
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"
      recache: ${{ inputs.recache }}

  windows-x64:
    needs: [prepare, linux-smoke-x64]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (
        inputs.targets == 'windows-x64' ||
        inputs.targets == 'macos-arm64-windows-x64' ||
        inputs.targets == 'all'
      )
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      recache: ${{ inputs.recache }}

  linux-clean-install:
    needs: [prepare, linux-smoke-x64, linux-x64, linux-arm64]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.validate_linux == 'true' &&
      (needs.linux-smoke-x64.result == 'success' || needs.linux-smoke-x64.result == 'skipped') &&
      (needs.linux-x64.result == 'success' || needs.linux-x64.result == 'skipped') &&
      (needs.linux-arm64.result == 'success' || needs.linux-arm64.result == 'skipped')
    name: Clean ${{ matrix.distro }} ${{ matrix.arch }} install
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Download native package
        uses: actions/download-artifact@v8
        with:
          name: wsjtx-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}-${{ matrix.format }}
          path: packages
      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: wsjtx-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}-AppImage
          path: appimages
      - name: Install and exercise packaged applications in a clean distribution
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p install-logs
          packages=(packages/*."$PACKAGE_FORMAT")
          appimages=(appimages/*.AppImage)
          if [ "${#packages[@]}" -ne 1 ] || [ ! -f "${packages[0]}" ] ||
             [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "::error::Expected exactly one native package and one AppImage"
            exit 1
          fi
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > install-logs/container-image.json
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/appimages:/appimages:ro" \
            -v "$PWD/.github/scripts:/validation:ro" \
            -v "$PWD/install-logs:/logs" \
            "$IMAGE" bash /validation/validate-linux-package-install.sh \
            "/${packages[0]}" "$DISTRO" "$ARCH" /logs "/${appimages[0]}"
      - name: Upload clean installation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-clean-install-${{ matrix.distro }}-${{ matrix.arch }}
          path: install-logs/
          if-no-files-found: warn
