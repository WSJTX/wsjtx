name: Build Windows x86_64

on:
  workflow_call:
    inputs:
      version:
        description: "WSJT-X version string"
        required: true
        type: string
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.2"
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false
      release_channel:
        description: "Build release channel: DEVEL, RC, or GA"
        required: false
        type: string
        default: "DEVEL"
      rc_number:
        description: "Release candidate number when release_channel is RC"
        required: false
        type: string
        default: ""
      sign_mode:
        description: >-
          "ephemeral" (default) self-signs the installer; "none" leaves
          it unsigned for downstream SignPath signing.
        required: false
        type: string
        default: "ephemeral"
    outputs:
      installer-artifact-id:
        description: "Installer artifact id, for the SignPath submit step"
        value: ${{ jobs.build.outputs.installer-artifact-id }}
  # Also runnable on its own ("Run workflow" / gh workflow run) to build just
  # the Windows installer, at ~1/6 the cost of the full ci.yml matrix. GitHub
  # only exposes workflow_dispatch when the trigger is present on the default
  # branch, so this must be merged to develop before it can be dispatched.
  # Inputs mirror workflow_call with standalone defaults: hamlib_branch matches
  # what ci.yml / release.yml actually pass (4.7.2, not the workflow_call legacy
  # default), and version defaults to a clearly-marked devel string -- overridable
  # via `-f version=...` -- so a manual build is never mistaken for a release.
  workflow_dispatch:
    inputs:
      version:
        description: "WSJT-X version string (installer filename + artifact names)"
        required: false
        type: string
        default: "3.2.0-devel"
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.2"
      recache:
        description: "Force ccache to recompile and refresh cached objects"
        required: false
        type: boolean
        default: false
      release_channel:
        description: "Build release channel"
        required: false
        type: choice
        options:
          - DEVEL
          - RC
          - GA
        default: "DEVEL"
      rc_number:
        description: "Release candidate number when release_channel is RC"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-latest
    outputs:
      installer-artifact-id: ${{ steps.upload_installer.outputs.artifact-id }}
    env:
      BOOST_VERSION: 1.91.0
      BOOST_SOURCE_SHA256: de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5
      WSJT_WINDOWS_API_FLOOR: "0x0601"
      VERSION: ${{ inputs.version }}
      HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
      WSJT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
      WSJT_RC_NUMBER: ${{ inputs.rc_number }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # windows-latest's git defaults to core.autocrlf=true, which converts
      # text-file line endings during checkout. The converted working tree
      # then differs from the index, so cmake/getsvn.cmake's git_local_changes
      # reports DIRTY and the resulting binary's About tab shows
      # "wsjtx-<ver>-<sha>-dirty". Disable autocrlf before checkout so the
      # working tree matches the index exactly. (No-op on macOS/Linux runners,
      # which already default to autocrlf=false; this fix is Windows-only.)
      - name: Disable core.autocrlf before checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Validate workflow inputs
        shell: bash
        env:
          WSJTX_VERSION: ${{ inputs.version }}
        run: .github/scripts/validate-ci-inputs.sh

      # Boost is source-built by build-windows-deps so the Windows 7 API floor
      # and Boost.Atomic patch stay pinned; do not install MSYS2 Boost here.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-osslsigncode
            mingw-w64-x86_64-ruby
            autoconf automake libtool

      # asciidoctor is a Ruby gem (no native MSYS2 package) — needed by
      # doc/CMakeLists.txt to build the WSJT-X user guide HTML referenced
      # by Help → Local User Guide.
      - name: Install asciidoctor (Ruby gem)
        run: gem install asciidoctor --no-document

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-x86_64-gcc-${{ github.sha }}
          restore-keys: |
            ccache-windows-x86_64-gcc-

      - name: Configure ccache
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          echo "CCACHE_DIR=${WORKSPACE}/.ccache" >> "$GITHUB_ENV"
          echo "ccache recache: ${{ inputs.recache }}"
          if [ "${{ inputs.recache }}" = "true" ]; then
            echo "CCACHE_RECACHE=1" >> "$GITHUB_ENV"
            echo "Forcing ccache recache for this run"
          fi
          mkdir -p "${WORKSPACE}/.ccache"
          ccache --version
          ccache --zero-stats

      - name: Build Windows dependencies
        id: windows-deps
        uses: ./.github/actions/build-windows-deps
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          boost_source_sha256: ${{ env.BOOST_SOURCE_SHA256 }}
          windows_api_floor: ${{ env.WSJT_WINDOWS_API_FLOOR }}
          hamlib_branch: ${{ inputs.hamlib_branch }}
          save_caches: ${{ github.event_name != 'pull_request' }}

      - name: Install OmniRig
        shell: pwsh
        run: |
          # Download OmniRig (provides type library embedded in OmniRig.exe for dumpcpp)
          Invoke-WebRequest -Uri "https://www.dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile OmniRig.zip
          Expand-Archive -Path OmniRig.zip -DestinationPath omnirig-extract
          # Run the installer silently (InnoSetup)
          $setup = Get-ChildItem -Path omnirig-extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No installer found in OmniRig.zip" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          # Locate the installed OmniRig.exe (embeds the COM type library)
          $omnirig = Get-ChildItem -Path "C:\Program Files*\Afreet\OmniRig" -Filter "OmniRig.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $omnirig) { throw "OmniRig install failed — OmniRig.exe not found" }
          echo "OMNIRIG_PATH=$($omnirig.FullName)" >> $env:GITHUB_ENV

      - name: Fix dumpcpp name (MSYS2 ships dumpcpp-qt5, CMake expects dumpcpp)
        run: |
          ln -sf /mingw64/bin/dumpcpp-qt5.exe /mingw64/bin/dumpcpp.exe

      - name: Configure build and tests
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          OMNIRIG=$(cygpath "${OMNIRIG_PATH}")
          BOOST_PREFIX="${{ steps.windows-deps.outputs.boost_prefix }}"
          HAMLIB_PREFIX="${{ steps.windows-deps.outputs.hamlib_prefix }}"
          cmake -G "MSYS Makefiles" -S . -B wsjtx-build \
            -DCMAKE_PREFIX_PATH="${BOOST_PREFIX};${HAMLIB_PREFIX}" \
            -DBOOST_ROOT="${BOOST_PREFIX}" \
            -DBOOST_INCLUDEDIR="${BOOST_PREFIX}/include" \
            -DBOOST_LIBRARYDIR="${BOOST_PREFIX}/lib" \
            -DHamlib_INCLUDE_DIR="${HAMLIB_PREFIX}/include" \
            -DHamlib_LIBRARY="${HAMLIB_PREFIX}/lib/libhamlib.dll.a" \
            -DRIGCTL_EXE="${HAMLIB_PREFIX}/bin/rigctl.exe" \
            -DRIGCTLD_EXE="${HAMLIB_PREFIX}/bin/rigctld.exe" \
            -DRIGCTLCOM_EXE="${HAMLIB_PREFIX}/bin/rigctlcom.exe" \
            -DCMAKE_C_FLAGS="-D_WIN32_WINNT=${WSJT_WINDOWS_API_FLOOR} -DWINVER=${WSJT_WINDOWS_API_FLOOR}" \
            -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=${WSJT_WINDOWS_API_FLOOR} -DWINVER=${WSJT_WINDOWS_API_FLOOR} -DBOOST_USE_WINAPI_VERSION=${WSJT_WINDOWS_API_FLOOR}" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOMNIRIG_TYPE_LIB="${OMNIRIG}" \
            -DCMAKE_Fortran_FLAGS="-fallow-argument-mismatch -std=legacy" \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_ENABLE_TESTS=ON \
            -DWSJT_FORTRAN_LIBRARY_VARIANTS=OPENMP_ONLY \
            -DWSJT_RELEASE_CHANNEL="${WSJT_RELEASE_CHANNEL}" \
            -DWSJT_RC_NUMBER="${WSJT_RC_NUMBER}" \
            -DPFUNIT_DIR="${{ steps.windows-deps.outputs.pfunit_dir }}" \
            -DGFTL_DIR="${{ steps.windows-deps.outputs.gftl_dir }}" \
            -DGFTL_SHARED_DIR="${{ steps.windows-deps.outputs.gftl_shared_dir }}" \
            -DFARGPARSE_DIR="${{ steps.windows-deps.outputs.fargparse_dir }}" \
            -Wno-dev

      - name: Build and test targets
        run: cmake --build wsjtx-build -j$(nproc)

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Run tests
        id: ctest
        run: |
          # Tests that link wsjt_qt (e.g. test_jtty_txstream) pull in the
          # rig-control code, so their exe imports libhamlib-4.dll. Hamlib is
          # built --enable-shared into hamlib-prefix, so hamlib-prefix/bin must
          # be on PATH for the test to load — the mingw runtime DLLs are already
          # reachable via /mingw64/bin, but hamlib-prefix is not. Without this
          # the test exits 0xc0000135 (STATUS_DLL_NOT_FOUND) at launch. The
          # packaged installer is unaffected: cpack's bundle_fixup copies
          # libhamlib-4.dll in.
          export PATH="${{ steps.windows-deps.outputs.boost_prefix }}/lib:${{ steps.windows-deps.outputs.hamlib_prefix }}/bin:${PATH}"
          ctest --output-on-failure --output-junit ctest-results.xml
        working-directory: wsjtx-build

      - name: Publish test summary
        if: always() && steps.ctest.conclusion != 'skipped'
        working-directory: wsjtx-build
        run: python3 ../.github/scripts/publish-ctest-summary.py "Windows x86_64" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always() && steps.ctest.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ctest-results-windows
          path: wsjtx-build/ctest-results.xml
          if-no-files-found: ignore

      # MAP65 builds by default again. Under OPENMP_ONLY, m65impl resolves
      # wsjt_fort_common to wsjt_fort_omp, so this keeps the Windows Fortran
      # linkage covered by CI.
      - name: Verify binary
        run: |
          file wsjtx-build/jt9.exe
          file wsjtx-build/map65/map65.exe
          test -f wsjtx-build/map65/map65.exe

      # Install to a staging prefix so bundle_fixup runs: its install(CODE)
      # step copies Qt and dependent runtime DLLs next to the installed
      # executables, making bin/ self-contained. Build-tree binaries are NOT
      # self-contained (they resolve Qt/libgfortran/libgomp via /mingw64/bin),
      # so the launch check below must run against the staged install, not the
      # build tree — otherwise it would fail for binaries that ship fine.
      - name: Stage install (runs bundle_fixup)
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          cmake --install wsjtx-build --prefix "${WORKSPACE}/stage-main"
          ls -la "${WORKSPACE}/stage-main/bin"

      - name: Audit staged runtime DLL imports
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          test -f "${WORKSPACE}/stage-main/bin/map65.exe"
          test -f "${WORKSPACE}/stage-main/bin/qmap.exe"
          bash .github/scripts/audit-staged-dll-imports-windows.sh \
            "${WORKSPACE}/stage-main/bin" \
            "${WORKSPACE}"/stage-main/bin/*.exe \
            "${WORKSPACE}"/stage-main/bin/*.dll

      - name: Smoke-launch staged WSJT-X (clean PATH)
        id: wsjtx_smoke
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          .github/scripts/smoke-launch-windows.sh \
            "${WORKSPACE}/stage-main/bin/wsjtx.exe" \
            --startup-smoke-test --rig-name CI-STARTUP

      - name: Upload WSJT-X startup diagnostics
        if: failure() && steps.wsjtx_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-startup-smoke-windows
          path: launch.out
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke-launch staged jt9 (clean PATH)
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          .github/scripts/smoke-launch-windows.sh "${WORKSPACE}/stage-main/bin/jt9.exe" --help

      # Emit an NSIS installer containing the full executable set
      # (wsjtx.exe, map65.exe, jt9, wsprd, fmtave, fcal, fmeasure + WSJT_BUILD_UTILS
      # ft8code/jt65code/... + rigctl wrappers + Qt runtime via bundle_fixup).
      # CMakeLists.txt:1989-1990 sets CPACK_GENERATOR=NSIS on WIN32 and
      # CPACK_MONOLITHIC_INSTALL=1 packages every install() target.
      - name: Package NSIS installer
        run: |
          cd wsjtx-build
          # Override CPACK_PACKAGE_VERSION and
          # CPACK_PACKAGE_FILE_NAME so the NSIS installer filename
          # matches the tag-derived version exactly, including any
          # pre-release suffix (-rc1, -beta1, etc.). CMakeLists.txt
          # VERSION is numeric-only (CMake won't accept suffixes), so
          # without this override cpack produces wsjtx-<numeric>-win64.exe
          # while the sign step and upload-artifact paths below expect
          # wsjtx-<inputs.version>-win64.exe. release.yml's prepare job
          # enforces numeric-base parity; this override covers the
          # suffix gap.
          cpack_args=(
            -G NSIS
            -D CPACK_PACKAGE_VERSION="${VERSION}"
            -D CPACK_PACKAGE_FILE_NAME="wsjtx-${VERSION}-win64"
          )
          if [ "${CPACK_VERBOSE:-0}" = "1" ]; then
            cpack_args+=(-V)
          fi
          cpack "${cpack_args[@]}"
          ls -la *.exe

      # Ephemeral cert for CI/DEVEL/RC builds; does not chain to a
      # trusted root. GA installers are SignPath-signed on the public
      # repo instead (sign_mode=none skips this step).
      - name: Sign installer with self-signed ephemeral cert
        if: inputs.sign_mode != 'none'
        run: |
          cd wsjtx-build
          INSTALLER=$(ls wsjtx-${VERSION}-*.exe | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: no NSIS installer produced by cpack"
            ls -la
            exit 1
          fi
          echo "Unsigned installer: $INSTALLER"
          # MSYS2 auto-converts arguments starting with '/' into Windows paths
          # (e.g., '/CN=...' becomes 'D:/a/_temp/msys64/CN=...').
          # MSYS2_ARG_CONV_EXCL="*" disables that conversion for this command.
          MSYS2_ARG_CONV_EXCL="*" openssl req -x509 -newkey rsa:2048 \
            -keyout ephemeral-key.pem -out ephemeral-cert.pem \
            -days 365 -nodes \
            -subj "/CN=WSJT-X Ephemeral Dev Signing/O=WSJTX/C=US"
          SIGNED="${INSTALLER%.exe}-signed.exe"
          osslsigncode sign \
            -certs ephemeral-cert.pem -key ephemeral-key.pem \
            -n "WSJT-X Installer" \
            -i "https://github.com/WSJTX/wsjtx-internal" \
            -h sha256 \
            -in "$INSTALLER" -out "$SIGNED"
          mv "$SIGNED" "$INSTALLER"
          rm -f ephemeral-key.pem ephemeral-cert.pem
          echo "Signed installer: $INSTALLER"
          osslsigncode verify "$INSTALLER" || true
          # Exit 0: osslsigncode verify returns non-zero on CA-untrust even
          # when the signature itself is structurally valid. The ephemeral
          # cert is self-signed by design; the "|| true" keeps CI green.
          # Structural presence is proven by the sign step succeeding above.

      - name: Upload installer artifact
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-windows-x86_64-installer
          path: wsjtx-build/wsjtx-${{ inputs.version }}-*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-windows-x86_64
          path: |
            wsjtx-build/jt9.exe
            wsjtx-build/wsprd.exe
            wsjtx-build/wsjtx.exe
