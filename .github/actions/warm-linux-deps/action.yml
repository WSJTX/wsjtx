name: "Warm Linux dependency caches"
description: "Restore or populate Linux pFUnit and Hamlib dependency caches without building WSJT-X."

inputs:
  arch:
    description: "Linux target architecture: x86_64 or aarch64"
    required: true
  hamlib_branch:
    description: "Hamlib branch to build"
    required: true
  runtime_base:
    description: "Runtime baseline tag used in dependency cache keys"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        SUDO=""
        if [ "$(id -u)" != "0" ]; then
          SUDO="sudo"
        fi
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends \
          ca-certificates git \
          build-essential cmake gfortran \
          autoconf automake libtool pkg-config \
          texinfo

    - name: Locate gfortran
      id: fc
      shell: bash
      run: echo "version=$(gfortran -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

    - name: Restore pFUnit cache
      id: pfunit-cache
      uses: actions/cache/restore@v5
      with:
        path: pfunit-prefix
        key: pfunit-linux-${{ inputs.arch }}-v4.14.0-${{ inputs.runtime_base }}-gfortran${{ steps.fc.outputs.version }}-epoch1-${{ hashFiles('.github/scripts/build-pfunit-linux.sh') }}

    - name: Build pFUnit
      if: steps.pfunit-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-pfunit-linux.sh v4.14.0 "${GITHUB_WORKSPACE}/pfunit-prefix"

    - name: Locate pFUnit config
      shell: bash
      run: |
        config=$(find "${GITHUB_WORKSPACE}/pfunit-prefix" -name PFUNITConfig.cmake -print -quit)
        if [ -z "$config" ]; then
          echo "ERROR: PFUNITConfig.cmake not found under pfunit-prefix"
          find "${GITHUB_WORKSPACE}/pfunit-prefix" -maxdepth 3 -type d
          exit 1
        fi
        echo "Found PFUNITConfig.cmake at: $config"

    - name: Save pFUnit cache
      if: steps.pfunit-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: pfunit-prefix
        key: ${{ steps.pfunit-cache.outputs.cache-primary-key }}

    - name: Restore Hamlib cache
      id: hamlib-cache
      uses: actions/cache/restore@v5
      with:
        path: hamlib-prefix
        key: hamlib-linux-${{ inputs.arch }}-${{ inputs.hamlib_branch }}-${{ inputs.runtime_base }}-${{ hashFiles('.github/scripts/build-hamlib-linux.sh') }}

    - name: Build Hamlib
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-hamlib-linux.sh "${{ inputs.hamlib_branch }}" "${GITHUB_WORKSPACE}/hamlib-prefix"

    - name: Verify Hamlib prefix
      shell: bash
      run: test -f "${GITHUB_WORKSPACE}/hamlib-prefix/lib/libhamlib.a"

    - name: Save Hamlib cache
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: hamlib-prefix
        key: ${{ steps.hamlib-cache.outputs.cache-primary-key }}
