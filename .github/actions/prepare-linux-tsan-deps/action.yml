name: "Prepare Linux TSan dependencies"
description: >-
  Restore or build pinned, ThreadSanitizer-instrumented Qt, Boost, and Hamlib
  prefixes for Linux x86_64.

inputs:
  hamlib_ref:
    description: "Pinned Hamlib ref expected by the TSan dependency tuple"
    required: true
  save_caches:
    description: "Save cache misses; enable only for trusted default-branch runs"
    required: false
    default: "false"

outputs:
  toolchain_id:
    description: "Exact GCC and sanitizer-runtime fingerprint"
    value: ${{ steps.tuple.outputs.toolchain_id }}

runs:
  using: "composite"
  steps:
    - name: Install pinned TSan toolchain and dependency build prerequisites
      shell: bash
      run: |
        .github/scripts/run-apt-get.sh update
        .github/scripts/run-apt-get.sh install -y --no-install-recommends \
          ca-certificates curl git xz-utils bzip2 perl python3 \
          build-essential binutils cmake ccache file make pkg-config xauth xvfb \
          gcc-13 g++-13 gfortran-13 \
          autoconf automake libtool texinfo \
          libfftw3-dev libreadline-dev libusb-1.0-0-dev portaudio19-dev \
          libasound2-dev libcups2-dev libdbus-1-dev libegl1-mesa-dev \
          libfontconfig1-dev libfreetype-dev libgl1-mesa-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libpulse-dev libssl-dev libudev-dev \
          libx11-dev libx11-xcb-dev libxcb1-dev libxcb-glx0-dev \
          libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
          libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
          libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
          libxcb-xinerama0-dev libxcb-xkb-dev \
          libxext-dev libxfixes-dev libxi-dev libxrender-dev \
          libxkbcommon-dev libxkbcommon-x11-dev

    - name: Resolve pinned TSan dependency keys
      id: tuple
      shell: bash
      env:
        REQUESTED_HAMLIB_REF: ${{ inputs.hamlib_ref }}
      run: |
        # shellcheck source=.github/scripts/tsan-linux-deps-config.sh
        source .github/scripts/tsan-linux-deps-config.sh
        if [ "$REQUESTED_HAMLIB_REF" != "$TSAN_HAMLIB_REF" ]; then
          echo "::error::TSan dependencies pin Hamlib ${TSAN_HAMLIB_REF}, not ${REQUESTED_HAMLIB_REF}"
          exit 1
        fi
        .github/scripts/tsan-linux-deps-config.sh --github-output

    - name: Restore Qt TSan cache
      id: qt-cache
      uses: actions/cache/restore@v5
      with:
        path: tsan-qt-prefix
        key: ${{ steps.tuple.outputs.qt_key }}

    - name: Build Qt with TSan
      if: steps.qt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-qt-tsan-linux.sh "${GITHUB_WORKSPACE}/tsan-qt-prefix"

    - name: Restore Boost TSan cache
      id: boost-cache
      uses: actions/cache/restore@v5
      with:
        path: tsan-boost-prefix
        key: ${{ steps.tuple.outputs.boost_key }}

    - name: Build Boost with TSan
      if: steps.boost-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-boost-tsan-linux.sh "${GITHUB_WORKSPACE}/tsan-boost-prefix"

    - name: Restore Hamlib TSan cache
      id: hamlib-cache
      uses: actions/cache/restore@v5
      with:
        path: tsan-hamlib-prefix
        key: ${{ steps.tuple.outputs.hamlib_key }}

    - name: Build Hamlib with TSan
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-hamlib-tsan-linux.sh "${GITHUB_WORKSPACE}/tsan-hamlib-prefix"

    - name: Verify TSan dependency prefixes
      shell: bash
      run: >-
        .github/scripts/verify-tsan-deps-linux.sh
        "${GITHUB_WORKSPACE}/tsan-qt-prefix"
        "${GITHUB_WORKSPACE}/tsan-boost-prefix"
        "${GITHUB_WORKSPACE}/tsan-hamlib-prefix"

    - name: Save Qt TSan cache
      if: steps.qt-cache.outputs.cache-hit != 'true' && inputs.save_caches == 'true'
      uses: actions/cache/save@v5
      with:
        path: tsan-qt-prefix
        key: ${{ steps.qt-cache.outputs.cache-primary-key }}

    - name: Save Boost TSan cache
      if: steps.boost-cache.outputs.cache-hit != 'true' && inputs.save_caches == 'true'
      uses: actions/cache/save@v5
      with:
        path: tsan-boost-prefix
        key: ${{ steps.boost-cache.outputs.cache-primary-key }}

    - name: Save Hamlib TSan cache
      if: steps.hamlib-cache.outputs.cache-hit != 'true' && inputs.save_caches == 'true'
      uses: actions/cache/save@v5
      with:
        path: tsan-hamlib-prefix
        key: ${{ steps.hamlib-cache.outputs.cache-primary-key }}

    - name: Export TSan dependency environment
      shell: bash
      run: |
        qt_prefix="${GITHUB_WORKSPACE}/tsan-qt-prefix"
        boost_prefix="${GITHUB_WORKSPACE}/tsan-boost-prefix"
        hamlib_prefix="${GITHUB_WORKSPACE}/tsan-hamlib-prefix"
        {
          echo "CC=${{ steps.tuple.outputs.cc }}"
          echo "CXX=${{ steps.tuple.outputs.cxx }}"
          echo "FC=${{ steps.tuple.outputs.fc }}"
          echo "TSAN_QT_PREFIX=$qt_prefix"
          echo "TSAN_BOOST_PREFIX=$boost_prefix"
          echo "TSAN_HAMLIB_PREFIX=$hamlib_prefix"
          echo "TSAN_CMAKE_PREFIX_PATH=$qt_prefix;$boost_prefix;$hamlib_prefix"
          echo "LD_LIBRARY_PATH=$qt_prefix/lib:$boost_prefix/lib:${LD_LIBRARY_PATH:-}"
          echo "PKG_CONFIG_PATH=$qt_prefix/lib/pkgconfig:$boost_prefix/lib/pkgconfig:$hamlib_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "QT_PLUGIN_PATH=$qt_prefix/plugins"
        } >> "$GITHUB_ENV"
        echo "$qt_prefix/bin" >> "$GITHUB_PATH"
