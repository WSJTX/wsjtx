name: "Build Linux payload"
description: >-
  Build, test, and package wsjtx for one Linux architecture. Encapsulates the
  full payload — pFUnit + Hamlib + cmake build + ctest + .deb + RPM + AppImage —
  so build-linux.yml can call it once per arch (one job per arch, optionally
  inside gcc:13.4.0-bookworm when runtime_base=bookworm-gcc13.4). The caller
  decides host-vs-container at the job level via the `container:` directive;
  this action just runs the same shell pipeline on whatever it lands on.

inputs:
  arch:
    description: "Linux target architecture: x86_64, aarch64, or armhf"
    required: true
  version:
    description: "WSJT-X version string"
    required: true
  hamlib_branch:
    description: "Hamlib branch to build"
    required: true
  runtime_base:
    description: >-
      Runtime profile used for cache namespacing. Use 'bookworm-gcc13.4' for
      the GCC 13.4 Bookworm image and 'host' for the GitHub-hosted
      ubuntu-24.04(-arm) runner. The value is part of every cache key so a
      profile change never reuses incompatible build outputs.
    required: false
    default: "host"
  recache:
    description: "Force ccache to recompile and refresh cached objects"
    required: false
    default: "false"
  release_channel:
    description: "Build release channel: DEVEL, RC, or GA"
    required: false
    default: "DEVEL"
  rc_number:
    description: "Release candidate number when release_channel is RC"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # The aarch64 leg runs inside gcc:13.4.0-bookworm as root. The x86_64 leg
    # runs on ubuntu-24.04 where sudo is required. This step covers both.
    - name: Install dependencies
      shell: bash
      run: |
        SUDO=""
        if [ "$(id -u)" != "0" ]; then
          SUDO="sudo"
        fi
        packages=(
          ca-certificates curl git
          build-essential cmake ccache
          libfftw3-dev libboost-all-dev
          qtbase5-dev qttools5-dev qtmultimedia5-dev libqt5serialport5-dev
          libqt5sql5-sqlite libqt5websockets5-dev
          libqt5multimedia5-plugins
          libusb-1.0-0-dev libudev-dev libreadline-dev
          autoconf automake libtool pkg-config
          texinfo
          dpkg-dev fakeroot
          asciidoctor
          rpm
          python3
          file xz-utils xauth xvfb
          portaudio19-dev
        )
        if ! command -v gfortran >/dev/null 2>&1; then
          packages+=(gfortran)
        fi
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends "${packages[@]}"

    - name: Select GCC 13.4 Bookworm toolchain
      if: inputs.runtime_base == 'bookworm-gcc13.4'
      shell: bash
      run: |
        CC=/usr/local/bin/gcc
        CXX=/usr/local/bin/g++
        FC=/usr/local/bin/gfortran

        for compiler in "$CC" "$CXX" "$FC"; do
          if [ ! -x "$compiler" ]; then
            echo "::error::Expected compiler not found at $compiler"
            exit 1
          fi
          version=$("$compiler" -dumpfullversion -dumpversion)
          echo "$compiler: $version"
          if [ "$version" != "13.4.0" ]; then
            echo "::error::Expected GCC 13.4.0, found $version at $compiler"
            exit 1
          fi
        done

        echo "CC=$CC" >> "$GITHUB_ENV"
        echo "CXX=$CXX" >> "$GITHUB_ENV"
        echo "FC=$FC" >> "$GITHUB_ENV"

    # ccache persists compiled objects across runs to cut rebuild time.
    # Namespaced by arch + runtime_base so the host and Bookworm-container
    # caches never collide; keyed on the commit SHA with a prefix
    # restore-key so each build warm-starts from the most recent ancestor.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: .ccache
        key: ccache-linux-${{ inputs.arch }}-${{ inputs.runtime_base }}-gcc-${{ github.sha }}
        restore-keys: |
          ccache-linux-${{ inputs.arch }}-${{ inputs.runtime_base }}-gcc-

    - name: Configure ccache
      shell: bash
      run: |
        echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"
        echo "ccache recache: ${{ inputs.recache }}"
        if [ "${{ inputs.recache }}" = "true" ]; then
          echo "CCACHE_RECACHE=1" >> "$GITHUB_ENV"
          echo "Forcing ccache recache for this run"
        fi
        mkdir -p "${GITHUB_WORKSPACE}/.ccache"
        ccache --version
        ccache --zero-stats

    - name: Locate gfortran
      id: fc
      shell: bash
      run: echo "version=$(gfortran -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

    - name: Cache pFUnit
      id: pfunit-cache
      uses: actions/cache@v5
      with:
        path: pfunit-prefix
        # Keyed on arch + runtime_base so the Bookworm aarch64 cache and a
        # host build never collide. hashFiles points at the shared
        # build-pfunit-linux.sh (the actual build recipe, also called by the
        # x86_64/aarch64 legs) so any change to how pFUnit is built rebusts
        # the cache.
        key: pfunit-linux-${{ inputs.arch }}-v4.14.0-${{ inputs.runtime_base }}-gfortran${{ steps.fc.outputs.version }}-epoch1-${{ hashFiles('.github/scripts/build-pfunit-linux.sh') }}

    - name: Build pFUnit
      if: steps.pfunit-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-pfunit-linux.sh v4.14.0 "${GITHUB_WORKSPACE}/pfunit-prefix"

    - name: Locate pFUnit config
      id: pfunit
      shell: bash
      run: |
        # `find -quit` instead of `find ... | head -1` so find doesn't get
        # SIGPIPE'd under bash pipefail (defensive — find normally produces
        # 1-2 lines so the pipe closes fine, but we hit the same class of
        # failure on dpkg-deb in container so apply the pattern uniformly).
        CONFIG=$(find "${GITHUB_WORKSPACE}/pfunit-prefix" -name PFUNITConfig.cmake -print -quit)
        if [ -z "$CONFIG" ]; then
          echo "ERROR: PFUNITConfig.cmake not found under pfunit-prefix"
          find "${GITHUB_WORKSPACE}/pfunit-prefix" -maxdepth 3 -type d
          exit 1
        fi
        PFUNIT_DIR="$(dirname "$CONFIG")"
        echo "Found PFUNITConfig.cmake at: $CONFIG"
        echo "dir=${PFUNIT_DIR}" >> "$GITHUB_OUTPUT"

    - name: Cache Hamlib
      id: hamlib-cache
      uses: actions/cache@v5
      with:
        path: hamlib-prefix
        key: hamlib-linux-${{ inputs.arch }}-${{ inputs.hamlib_branch }}-${{ inputs.runtime_base }}-${{ hashFiles('.github/scripts/build-hamlib-linux.sh') }}

    - name: Build Hamlib
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/build-hamlib-linux.sh "${{ inputs.hamlib_branch }}" "${GITHUB_WORKSPACE}/hamlib-prefix"

    - name: Verify Hamlib prefix
      shell: bash
      run: test -f "${GITHUB_WORKSPACE}/hamlib-prefix/lib/libhamlib.a"

    - name: Configure build and tests
      shell: bash
      run: |
        cmake -S . -B wsjtx-build \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/hamlib-prefix;${GITHUB_WORKSPACE}/pfunit-prefix" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DWSJT_SKIP_MANPAGES=ON \
          -DWSJT_ENABLE_TESTS=ON \
          -DWSJT_FORTRAN_LIBRARY_VARIANTS=OPENMP_ONLY \
          -DWSJT_RELEASE_CHANNEL="${{ inputs.release_channel }}" \
          -DWSJT_RC_NUMBER="${{ inputs.rc_number }}" \
          -DPFUNIT_DIR="${{ steps.pfunit.outputs.dir }}" \
          -Wno-dev

    - name: Build and test targets
      shell: bash
      run: cmake --build wsjtx-build -j$(nproc)

    - name: Show ccache stats
      if: always()
      shell: bash
      run: ccache --show-stats

    # Configure sweep across the Fortran-variant matrix with MAP65 enabled.
    # Sentinel target builds keep central Fortran linkage covered without
    # duplicating the full main build across every variant. x86_64-only:
    # this is build-coverage for the central Fortran linkage, not a per-arch
    # runtime concern, so it runs once on the cheapest/native leg.
    - name: Configure-matrix (Fortran variants × MAP65)
      if: inputs.arch == 'x86_64'
      shell: bash
      run: |
        fail=0
        for variant in AUTO BOTH OPENMP_ONLY NON_OPENMP_ONLY; do
          echo "::group::configure WSJT_FORTRAN_LIBRARY_VARIANTS=${variant} (MAP65 enabled)"
          rm -rf "cfgmatrix-${variant}"
          if cmake -S . -B "cfgmatrix-${variant}" \
               -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/hamlib-prefix;${GITHUB_WORKSPACE}/pfunit-prefix" \
               -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
               -DWSJT_SKIP_MANPAGES=ON \
               -DWSJT_FORTRAN_LIBRARY_VARIANTS="${variant}" \
               -DPFUNIT_DIR="${{ steps.pfunit.outputs.dir }}" \
               -Wno-dev; then
            echo "configure OK: ${variant}"
          else
            echo "::error::configure FAILED for WSJT_FORTRAN_LIBRARY_VARIANTS=${variant} with MAP65 enabled"
            fail=1
          fi
          echo "::endgroup::"

          case "${variant}" in
            AUTO|NON_OPENMP_ONLY)
              echo "::group::sentinel build WSJT_FORTRAN_LIBRARY_VARIANTS=${variant}"
              if cmake --build "cfgmatrix-${variant}" \
                   --target jt65sim m65impl qmap_impl test_jtty_pack \
                   -j$(nproc); then
                echo "sentinel build OK: ${variant}"
              else
                echo "::error::sentinel build FAILED for WSJT_FORTRAN_LIBRARY_VARIANTS=${variant}"
                fail=1
              fi
              echo "::endgroup::"
              ;;
          esac
        done
        exit $fail

    - name: Configure deprecated MAP65 skip path
      if: inputs.arch == 'x86_64'
      shell: bash
      run: |
        cmake -S . -B cfgmatrix-skip-map65-openmp-only \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/hamlib-prefix;${GITHUB_WORKSPACE}/pfunit-prefix" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DWSJT_SKIP_MANPAGES=ON \
          -DWSJT_SKIP_MAP65=ON \
          -DWSJT_FORTRAN_LIBRARY_VARIANTS=OPENMP_ONLY \
          -DPFUNIT_DIR="${{ steps.pfunit.outputs.dir }}" \
          -Wno-dev

    - name: Run tests
      id: ctest
      shell: bash
      run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --output-on-failure --output-junit ctest-results.xml
      working-directory: wsjtx-build
      env:
        QT_QPA_PLATFORM: xcb

    - name: Publish test summary
      if: always() && steps.ctest.conclusion != 'skipped'
      shell: bash
      working-directory: wsjtx-build
      run: python3 ../.github/scripts/publish-ctest-summary.py "Linux ${{ inputs.arch }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: always() && steps.ctest.conclusion != 'skipped'
      uses: actions/upload-artifact@v7
      with:
        name: ctest-results-linux-${{ inputs.arch }}
        path: wsjtx-build/ctest-results.xml
        if-no-files-found: ignore

    - name: Verify binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        # Capture once and re-use to avoid SIGPIPE on `file ... | grep -q`
        # under pipefail (file's output is small but the same defensive
        # pattern as the rest of this action — predictable diagnostic).
        FILE_OUT=$(file wsjtx-build/jt9)
        echo "$FILE_OUT"
        # ELF class is arch-dependent: armhf is 32-bit ARM EABI5, the rest
        # are 64-bit. Conditionalize the assertion so a cross-arch mismatch
        # (e.g. host toolchain leaking through QEMU) fails fast here.
        case "$ARCH" in
          armhf)
            [[ "$FILE_OUT" == *"ELF 32-bit"* ]]
            [[ "$FILE_OUT" == *"ARM, EABI5"* ]]
            ;;
          *)
            [[ "$FILE_OUT" == *"ELF 64-bit"* ]]
            ;;
        esac

    # CMakeLists.txt:1989-2012 enables CPack's DEB generator when
    # dpkg-buildpackage is on the path (provided by dpkg-dev, installed
    # above). The DEB generator ignores CPACK_PACKAGE_FILE_NAME and
    # uses its own CPACK_DEBIAN_FILE_NAME (default <pkg>_<ver>_<arch>.deb
    # → wsjtx_3.0.1_amd64.deb regardless). Override that variable to
    # align the filename with the AppImage/installer naming used by
    # the rest of the pipeline.
    - name: Package .deb
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
      run: |
        cd wsjtx-build
        cpack -G DEB \
          -D "CPACK_DEBIAN_FILE_NAME=wsjtx-${VERSION}-linux-${ARCH}.deb"
        DEB="wsjtx-${VERSION}-linux-${ARCH}.deb"
        if [ ! -f "$DEB" ]; then
          echo "::error::cpack -G DEB produced no .deb at expected path: $DEB"
          ls -la *.deb 2>/dev/null || true
          exit 1
        fi
        ls -lh "$DEB"
        file "$DEB"
        # sed instead of `| head -20` so dpkg-deb doesn't get SIGPIPE'd by
        # head's early close — interacts badly with `bash -o pipefail` under
        # Bookworm's dpkg-deb (observed exit 141 on first container run).
        dpkg-deb --info "$DEB" | sed -n '1,20p'
        FILES=$(dpkg-deb -c "$DEB")
        require_package_path() {
          local path="$1"
          case $'\n'"$FILES"$'\n' in
            *"$path"$'\n'*) ;;
            *)
              echo "::error::Expected package path is missing: $path"
              exit 1
              ;;
          esac
        }
        require_package_path "/usr/bin/qmap"
        require_package_path "/usr/bin/map65"

    - name: Upload .deb
      uses: actions/upload-artifact@v7
      with:
        name: wsjtx-${{ inputs.version }}-linux-${{ inputs.arch }}-deb
        path: wsjtx-build/wsjtx-${{ inputs.version }}-linux-${{ inputs.arch }}.deb
        if-no-files-found: error

    # RPM builds via the same CPack scaffolding the .deb step above
    # uses. CMakeLists.txt:2014-2026 already auto-detects rpmbuild and
    # sets the Fedora-style dependency list (qt5-qtbase >= 5.9, fftw-
    # libs-single, boost-log, etc.); only the workflow side was
    # missing. `-G RPM` is explicit so this step doesn't accidentally
    # rebuild the .deb already produced above.
    - name: Package RPM
      shell: bash
      working-directory: wsjtx-build
      run: |
        cpack -G RPM
        ls -lh *.rpm

    - name: Smoke-test RPM
      shell: bash
      working-directory: wsjtx-build
      run: |
        # Capture rpm -qpl once to avoid SIGPIPE on `| head` / `| grep -q`
        # under `bash -o pipefail` (the same pattern that broke dpkg-deb on
        # the Bookworm aarch64 leg). One rpm invocation, three queries.
        RPM=$(ls *.rpm | sed -n '1p')
        echo "Querying $RPM"
        rpm -qpi "$RPM"
        rpm -qpR "$RPM"
        FILES=$(rpm -qpl "$RPM")
        echo "$FILES" | sed -n '1,40p'
        require_package_path() {
          local path="$1"
          case $'\n'"$FILES"$'\n' in
            *"$path"$'\n'*) ;;
            *)
              echo "::error::Expected package path is missing: $path"
              exit 1
              ;;
          esac
        }
        require_package_path "/usr/bin/wsjtx"
        require_package_path "/usr/bin/jt9"
        require_package_path "/usr/bin/qmap"
        require_package_path "/usr/bin/map65"

    - name: Upload RPM
      uses: actions/upload-artifact@v7
      with:
        name: wsjtx-${{ inputs.version }}-linux-${{ inputs.arch }}-rpm
        path: wsjtx-build/*.rpm
        if-no-files-found: error

    - name: Install to AppDir
      shell: bash
      run: |
        cmake --install wsjtx-build --prefix "${GITHUB_WORKSPACE}/AppDir/usr"
        # linuxdeploy's desktop/icon integration needs these exact paths.
        test -x AppDir/usr/bin/wsjtx
        test -x AppDir/usr/bin/jt9
        test -x AppDir/usr/bin/qmap
        test -x AppDir/usr/bin/map65
        test -x AppDir/usr/bin/ft8code
        test -f AppDir/usr/share/applications/wsjtx.desktop
        test -f AppDir/usr/share/pixmaps/wsjtx_icon.png

    - name: Package AppImage
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
        # Core linuxdeploy is pinned to a dated release. The Qt5 plugin
        # stays on the rolling "continuous" channel because upstream has
        # not cut a dated release since 1-alpha-20250213-1, which carries
        # a filesystem_error bug on ubuntu-24.04 / Qt5.15.
        LINUXDEPLOY_TAG: "1-alpha-20251107-1"
        # Force every AppImage spawned by linuxdeploy (the qt plugin and
        # appimagetool, both invoked as AppImages internally) to use
        # `--appimage-extract-and-run` instead of expecting FUSE to be
        # available. The host runner has libfuse2 installed by default so
        # the plain `./linuxdeploy.AppImage --appimage-extract-and-run`
        # was enough for x86_64; the Bookworm container has no FUSE and the
        # plugin AppImage's first call (`--plugin-api-version`) exits 127
        # without this env var. APPIMAGE_EXTRACT_AND_RUN=1 is the
        # AppImage runtime's documented FUSE-less escape hatch.
        APPIMAGE_EXTRACT_AND_RUN: "1"
      run: |
        curl_flags=(--fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 5)
        case "$ARCH" in
          x86_64)
            LINUXDEPLOY_SHA256="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
            QT_PLUGIN_SHA256="be1b7e166bf9975cfb694ebe6759ba40502ffc6196440d3e64aa90c4dbd67e9f"
            ;;
          aarch64)
            LINUXDEPLOY_SHA256="620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff"
            QT_PLUGIN_SHA256="5525e6c49c3c774c02b8864d2acc2ae4c5c0ccc3327f7dce626deaa36348e5c6"
            ;;
          armhf)
            LINUXDEPLOY_SHA256="e359161979fa4bee50b92ce7102fb510299caebf34f711d983fba7a8f4bb1c2e"
            QT_PLUGIN_SHA256="463c3d853e78adc0bde8a9b2806c19b20eb60dd18799f8c6e68d873fb2be8ba0"
            ;;
          *)       echo "::error::Unknown linuxdeploy arch: $ARCH"; exit 1 ;;
        esac

        QT_PLUGIN_ASSET_NAME="linuxdeploy-plugin-qt-${ARCH}.AppImage"
        QT_PLUGIN_ASSET_ID="$(
          curl "${curl_flags[@]}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/linuxdeploy/linuxdeploy-plugin-qt/releases/tags/continuous" |
          python3 -c 'import json, sys; name = sys.argv[1]; matches = [asset for asset in json.load(sys.stdin)["assets"] if asset["name"] == name]; print(matches[0]["id"]) if matches else sys.exit("asset not found: " + name)' "$QT_PLUGIN_ASSET_NAME"
        )"

        # If upstream refreshes the continuous Qt plugin assets, this lookup
        # will keep finding the right asset ID by name; recalculate
        # QT_PLUGIN_SHA256 after reviewing the new binary.
        curl "${curl_flags[@]}" -o linuxdeploy.AppImage \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-${ARCH}.AppImage"
        curl "${curl_flags[@]}" -H "Accept: application/octet-stream" -o linuxdeploy-plugin-qt.AppImage \
          "https://api.github.com/repos/linuxdeploy/linuxdeploy-plugin-qt/releases/assets/${QT_PLUGIN_ASSET_ID}"
        echo "${LINUXDEPLOY_SHA256}  linuxdeploy.AppImage" | sha256sum -c -
        echo "${QT_PLUGIN_SHA256}  linuxdeploy-plugin-qt.AppImage" | sha256sum -c -
        chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

        # --appimage-extract-and-run on linuxdeploy itself + the env-var
        # above on every child AppImage means the whole pipeline runs
        # FUSE-free.
        export OUTPUT="wsjtx-${VERSION}-linux-${ARCH}.AppImage"
        ./linuxdeploy.AppImage --appimage-extract-and-run \
          --appdir AppDir \
          --plugin qt \
          --output appimage \
          --desktop-file AppDir/usr/share/applications/wsjtx.desktop \
          --icon-file AppDir/usr/share/pixmaps/wsjtx_icon.png

        ls -lh "$OUTPUT"
        file "$OUTPUT"

    - name: Smoke-test AppImage payload
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
      run: |
        APPIMAGE="wsjtx-${VERSION}-linux-${ARCH}.AppImage"
        ./"$APPIMAGE" --appimage-extract >/dev/null
        test -x squashfs-root/usr/bin/wsjtx
        test -x squashfs-root/usr/bin/jt9
        test -x squashfs-root/usr/bin/qmap
        test -x squashfs-root/usr/bin/map65
        test -x squashfs-root/usr/bin/ft8code
        test -x squashfs-root/usr/bin/wsprd
        # Capture before grep to avoid SIGPIPE on grep -q under pipefail.
        # Same arch-conditional ELF class check as the standalone Verify
        # binary step above — armhf is 32-bit ARM EABI5, the rest are 64-bit.
        FILE_OUT=$(file squashfs-root/usr/bin/wsjtx)
        case "$ARCH" in
          armhf)
            [[ "$FILE_OUT" == *"ELF 32-bit"* ]]
            [[ "$FILE_OUT" == *"ARM, EABI5"* ]]
            ;;
          *)
            [[ "$FILE_OUT" == *"ELF 64-bit"* ]]
            ;;
        esac
        # Qt5 libs should have been bundled by linuxdeploy-plugin-qt.
        LIBS=$(ls squashfs-root/usr/lib/)
        case $'\n'"$LIBS"$'\n' in *$'\n'libQt5Core.so*) ;; *) exit 1 ;; esac
        case $'\n'"$LIBS"$'\n' in *$'\n'libQt5Widgets.so*) ;; *) exit 1 ;; esac
        case $'\n'"$LIBS"$'\n' in *$'\n'libQt5Multimedia.so*) ;; *) exit 1 ;; esac
        for required_file in \
          squashfs-root/usr/bin/qt.conf \
          squashfs-root/usr/plugins/platforms/libqxcb.so \
          squashfs-root/usr/plugins/sqldrivers/libqsqlite.so; do
          if [ ! -f "$required_file" ]; then
            echo "::error::Required AppImage payload file is missing: ${required_file}"
            exit 1
          fi
        done
        if ! grep -Eq '^[[:space:]]*Plugins[[:space:]]*=[[:space:]]*plugins[[:space:]]*$' \
          squashfs-root/usr/bin/qt.conf; then
          echo "::error::AppImage qt.conf must set Plugins = plugins"
          echo "AppImage qt.conf contents:"
          cat squashfs-root/usr/bin/qt.conf
          exit 1
        fi
        # Verify Qt audio backend plugins were bundled. Without them,
        # QAudioDeviceInfo::availableDevices() returns empty at runtime
        # and the user sees "no audio devices" — observed in v3.0.1 on
        # Linux Lite. linuxdeploy-plugin-qt only WARNS when these are
        # absent on the build host, it doesn't fail.
        # Linux shared objects are conventionally `lib*.so` so the
        # bundled plugins are libqtaudio_alsa.so and libqtmedia_pulse.so.
        audio_plugins=$(find squashfs-root -path '*/plugins/audio/*.so' 2>/dev/null)
        if [ -z "$audio_plugins" ]; then
          echo "::error::No Qt audio backend plugins (qtaudio_alsa/qtaudio_pulse) bundled in AppImage."
          echo "::error::Install libqt5multimedia5-plugins on the build host so linuxdeploy-plugin-qt can find them."
          echo "AppImage plugin tree:"
          find squashfs-root -path '*/plugins/*' -name '*.so' 2>/dev/null | sed -n '1,20p'
          exit 1
        fi
        echo "Qt audio plugins bundled:"
        echo "$audio_plugins"
        rm -rf squashfs-root

    # armhf uses a separate QEMU payload script and intentionally remains
    # structural-only; this runtime launch covers native x86_64 and aarch64.
    - name: Runtime-smoke-test AppImage
      id: appimage_runtime_smoke
      if: inputs.arch != 'armhf'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
      run: |
        APPIMAGE="wsjtx-${VERSION}-linux-${ARCH}.AppImage"
        LOG="wsjtx-build/appimage-startup-smoke.log"

        set +e
        env \
          -u LD_LIBRARY_PATH \
          -u LD_PRELOAD \
          -u LD_AUDIT \
          -u QT_PLUGIN_PATH \
          -u QT_QPA_PLATFORM_PLUGIN_PATH \
          -u QML_IMPORT_PATH \
          -u QML2_IMPORT_PATH \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          QT_QPA_PLATFORM=xcb \
          timeout --kill-after=5s 45s \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            "./$APPIMAGE" \
            --startup-smoke-test \
            --rig-name CI-APPIMAGE-STARTUP \
            >"$LOG" 2>&1
        status=$?
        set -e

        cat "$LOG"

        if [ "$status" -eq 124 ]; then
          echo "::error::AppImage startup smoke test timed out after 45 seconds"
          exit 1
        fi
        if [ "$status" -ne 0 ]; then
          echo "::error::AppImage startup smoke test exited with status $status"
          exit 1
        fi
        if ! grep -Fq "WSJT-X startup smoke test passed" "$LOG"; then
          echo "::error::AppImage exited successfully without the startup-smoke success marker"
          exit 1
        fi

    - name: Upload AppImage startup diagnostics
      if: failure() && steps.appimage_runtime_smoke.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: wsjtx-startup-smoke-linux-${{ inputs.arch }}
        path: wsjtx-build/appimage-startup-smoke.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        name: wsjtx-${{ inputs.version }}-linux-${{ inputs.arch }}-AppImage
        path: wsjtx-${{ inputs.version }}-linux-${{ inputs.arch }}.AppImage
        if-no-files-found: error

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wsjtx-${{ inputs.version }}-linux-${{ inputs.arch }}
        path: |
          wsjtx-build/jt9
          wsjtx-build/wsprd
          wsjtx-build/wsjtx
