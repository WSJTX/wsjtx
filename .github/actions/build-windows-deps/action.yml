name: "Build Windows dependencies"
description: "Restore or populate Windows Boost, FFTW, pFUnit, and Hamlib dependency caches."

inputs:
  boost_version:
    description: "Boost version to build"
    required: false
    default: "1.91.0"
  boost_source_sha256:
    description: "Expected SHA-256 for the Boost source archive"
    required: false
    default: "de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5"
  windows_api_floor:
    description: "Windows API floor used for Boost and WSJT-X builds"
    required: false
    default: "0x0601"
  hamlib_branch:
    description: "Hamlib branch to build"
    required: true
  cold_build:
    description: "Bypass dependency cache restores and saves"
    required: false
    default: "false"
  save_caches:
    description: "Whether to save dependency caches on misses"
    required: false
    default: "true"

outputs:
  fftw_prefix:
    description: "MSYS path to the pinned FFTW prefix"
    value: ${{ steps.paths.outputs.fftw_prefix }}
  boost_prefix:
    description: "MSYS path to the Boost prefix"
    value: ${{ steps.paths.outputs.boost_prefix }}
  hamlib_prefix:
    description: "MSYS path to the Hamlib prefix"
    value: ${{ steps.paths.outputs.hamlib_prefix }}
  pfunit_dir:
    description: "Directory containing PFUNITConfig.cmake"
    value: ${{ steps.pfunit.outputs.pfunit_dir }}
  gftl_dir:
    description: "Directory containing GFTLConfig.cmake"
    value: ${{ steps.pfunit.outputs.gftl_dir }}
  gftl_shared_dir:
    description: "Directory containing GFTL_SHAREDConfig.cmake"
    value: ${{ steps.pfunit.outputs.gftl_shared_dir }}
  fargparse_dir:
    description: "Directory containing FARGPARSEConfig.cmake"
    value: ${{ steps.pfunit.outputs.fargparse_dir }}

runs:
  using: "composite"
  steps:
    - name: Validate workflow inputs
      shell: bash
      env:
        HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
      run: .github/scripts/validate-ci-inputs.sh

    - name: Resolve dependency prefixes
      id: paths
      shell: msys2 {0}
      run: |
        WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
        {
          echo "boost_prefix=${WORKSPACE}/boost-prefix"
          echo "fftw_prefix=${WORKSPACE}/fftw-prefix"
          echo "hamlib_prefix=${WORKSPACE}/hamlib-prefix"
          echo "pfunit_prefix=${WORKSPACE}/pfunit-prefix"
        } >> "$GITHUB_OUTPUT"

    - name: Restore FFTW cache
      id: fftw-cache
      if: inputs.cold_build != 'true'
      uses: actions/cache/restore@v6
      with:
        path: fftw-prefix
        key: fftw-windows-ucrt64-${{ hashFiles('.github/scripts/fftw-version.sh', '.github/scripts/install-fftw-windows.sh') }}

    - name: Install FFTW
      id: fftw-build
      if: steps.fftw-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: bash .github/scripts/install-fftw-windows.sh "${{ steps.paths.outputs.fftw_prefix }}"

    - name: Verify FFTW runtime
      shell: msys2 {0}
      run: |
        . .github/scripts/fftw-version.sh
        prefix="${{ steps.paths.outputs.fftw_prefix }}"
        gcc -I"$prefix/include" tests/dependencies/test_fftw_runtime.c \
          -L"$prefix/lib" -lfftw3f_threads -lfftw3f -lm -o fftw-runtime-check.exe
        PATH="$prefix/bin:$PATH" ./fftw-runtime-check.exe "$FFTW_VERSION"

    - name: Save FFTW cache
      if: inputs.cold_build != 'true' && inputs.save_caches == 'true' && steps.fftw-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: fftw-prefix
        key: ${{ steps.fftw-cache.outputs.cache-primary-key }}

    - name: Restore Boost cache
      id: boost-cache
      if: inputs.cold_build != 'true'
      uses: actions/cache/restore@v6
      with:
        path: boost-prefix
        key: boost-windows-windows-latest-ucrt64-${{ inputs.boost_version }}-${{ inputs.boost_source_sha256 }}-winapi${{ inputs.windows_api_floor }}-epoch1-${{ hashFiles('.github/scripts/build-boost-windows.sh') }}

    - name: Build Boost
      id: boost-build
      if: steps.boost-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: .github/scripts/build-boost-windows.sh "${{ inputs.boost_version }}" "${{ inputs.boost_source_sha256 }}" "${{ inputs.windows_api_floor }}" "${{ steps.paths.outputs.boost_prefix }}"

    - name: Save Boost cache
      if: inputs.cold_build != 'true' && inputs.save_caches == 'true' && steps.boost-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: boost-prefix
        key: ${{ steps.boost-cache.outputs.cache-primary-key }}

    - name: Verify Boost Windows API floor
      shell: msys2 {0}
      run: |
        boost_dlls=("${{ steps.paths.outputs.boost_prefix }}"/lib/libboost_*.dll)
        if [ ! -e "${boost_dlls[0]}" ]; then
          echo "::error::Boost DLLs not found under ${{ steps.paths.outputs.boost_prefix }}/lib"
          ls -la "${{ steps.paths.outputs.boost_prefix }}/lib" || true
          exit 1
        fi
        bad=0
        for boost_dll in "${boost_dlls[@]}"; do
          echo "Inspecting ${boost_dll}"
          objdump -p "$boost_dll" | awk '/DLL Name:/ {print "  " $3}' | sort -u
          if objdump -p "$boost_dll" | awk '/WaitOnAddress|WakeByAddressSingle|WakeByAddressAll|api-ms-win-core-synch-l1-2-0\.dll/ { found=1; print } END { exit found ? 0 : 1 }'; then
            echo "::error::${boost_dll} imports Windows 8+ synchronization APIs"
            bad=1
          fi
        done
        exit "$bad"

    - name: Locate gfortran
      id: fc
      shell: msys2 {0}
      run: echo "version=$(gfortran -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

    - name: Restore pFUnit cache
      id: pfunit-cache
      if: inputs.cold_build != 'true'
      uses: actions/cache/restore@v6
      with:
        path: pfunit-prefix
        key: pfunit-windows-windows-latest-ucrt64-v4.14.0-gfortran${{ steps.fc.outputs.version }}-epoch1-${{ hashFiles('.github/scripts/build-pfunit-windows.sh') }}

    - name: Build pFUnit
      id: pfunit-build
      if: steps.pfunit-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: .github/scripts/build-pfunit-windows.sh v4.14.0 "${{ steps.paths.outputs.pfunit_prefix }}"

    - name: Locate pFUnit config
      id: pfunit
      shell: msys2 {0}
      run: |
        for pkg in PFUNIT GFTL GFTL_SHARED FARGPARSE; do
          CONFIG=$(find "${{ steps.paths.outputs.pfunit_prefix }}" -name ${pkg}Config.cmake | head -1)
          if [ -z "$CONFIG" ]; then
            echo "ERROR: ${pkg}Config.cmake not found under pfunit-prefix"
            find "${{ steps.paths.outputs.pfunit_prefix }}" -maxdepth 3 -type d
            exit 1
          fi
          DIR="$(dirname "$CONFIG")"
          echo "Found ${pkg}Config.cmake at: $CONFIG"
          echo "$(echo $pkg | tr '[:upper:]' '[:lower:]')_dir=${DIR}" >> "$GITHUB_OUTPUT"
        done

    - name: Save pFUnit cache
      if: inputs.cold_build != 'true' && inputs.save_caches == 'true' && steps.pfunit-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: pfunit-prefix
        key: ${{ steps.pfunit-cache.outputs.cache-primary-key }}

    - name: Restore Hamlib cache
      id: hamlib-cache
      if: inputs.cold_build != 'true'
      uses: actions/cache/restore@v6
      with:
        path: hamlib-prefix
        key: hamlib-windows-windows-latest-ucrt64-${{ inputs.hamlib_branch }}-epoch2-${{ hashFiles('.github/scripts/build-hamlib-windows.sh', '.github/patches/hamlib-funcube-windows-hid.patch', '.github/patches/hamlib-windows-precise-time.patch', '.github/scripts/tests/test_hamlib_funcube_patch.py', '.github/scripts/tests/test_hamlib_precise_time.c') }}

    - name: Build Hamlib
      id: hamlib-build
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        MSYS2_PATH_TYPE: inherit
        HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
      run: .github/scripts/build-hamlib-windows.sh "$HAMLIB_BRANCH" "${{ steps.paths.outputs.hamlib_prefix }}"

    - name: Verify Hamlib prefix
      shell: msys2 {0}
      run: |
        test -f "${{ steps.paths.outputs.hamlib_prefix }}/bin/libhamlib-4.dll"
        test -f "${{ steps.paths.outputs.hamlib_prefix }}/bin/rigctl.exe"
        test -f "${{ steps.paths.outputs.hamlib_prefix }}/bin/rigctld.exe"
        test -f "${{ steps.paths.outputs.hamlib_prefix }}/bin/rigctlcom.exe"
        test -f "${{ steps.paths.outputs.hamlib_prefix }}/include/hamlib/rig.h"
        test -f "${{ steps.paths.outputs.hamlib_prefix }}/lib/libhamlib.dll.a"

    - name: Save Hamlib cache
      if: inputs.cold_build != 'true' && inputs.save_caches == 'true' && steps.hamlib-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: hamlib-prefix
        key: ${{ steps.hamlib-cache.outputs.cache-primary-key }}

    - name: Summarize dependency caches
      if: always()
      shell: bash
      env:
        CACHE_STEPS: ${{ toJSON(steps) }}
        COLD_BUILD: ${{ inputs.cold_build }}
      run: python .github/scripts/summarize-native-caches.py boost fftw hamlib pfunit >> "$GITHUB_STEP_SUMMARY"
