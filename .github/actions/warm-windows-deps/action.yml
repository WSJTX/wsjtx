name: "Warm Windows dependency caches"
description: "Restore or populate Windows pFUnit and Hamlib dependency caches without building WSJT-X."

inputs:
  hamlib_branch:
    description: "Hamlib branch to build"
    required: true

runs:
  using: "composite"
  steps:
    - name: Disable core.autocrlf before checkout
      shell: pwsh
      run: git config --global core.autocrlf false

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          git make tar
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gcc-fortran
          mingw-w64-x86_64-cmake
          autoconf automake libtool

    - name: Locate gfortran
      id: fc
      shell: msys2 {0}
      run: echo "version=$(gfortran -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

    - name: Restore pFUnit cache
      id: pfunit-cache
      uses: actions/cache/restore@v5
      with:
        path: pfunit-prefix
        key: pfunit-windows-windows-latest-mingw64-v4.14.0-gfortran${{ steps.fc.outputs.version }}-epoch1-${{ hashFiles('.github/scripts/build-pfunit-windows.sh') }}

    - name: Build pFUnit
      if: steps.pfunit-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
        .github/scripts/build-pfunit-windows.sh v4.14.0 "${WORKSPACE}/pfunit-prefix"

    - name: Locate pFUnit config
      shell: msys2 {0}
      run: |
        WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
        config=$(find "${WORKSPACE}/pfunit-prefix" -name PFUNITConfig.cmake -print -quit)
        if [ -z "$config" ]; then
          echo "ERROR: PFUNITConfig.cmake not found under pfunit-prefix"
          find "${WORKSPACE}/pfunit-prefix" -maxdepth 3 -type d
          exit 1
        fi
        echo "Found PFUNITConfig.cmake at: $config"

    - name: Save pFUnit cache
      if: steps.pfunit-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: pfunit-prefix
        key: ${{ steps.pfunit-cache.outputs.cache-primary-key }}

    - name: Restore Hamlib cache
      id: hamlib-cache
      uses: actions/cache/restore@v5
      with:
        path: hamlib-prefix
        key: hamlib-windows-windows-latest-mingw64-${{ inputs.hamlib_branch }}-epoch1-${{ hashFiles('.github/scripts/build-hamlib-windows.sh') }}

    - name: Build Hamlib
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        MSYS2_PATH_TYPE: inherit
      run: |
        WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
        .github/scripts/build-hamlib-windows.sh "${{ inputs.hamlib_branch }}" "${WORKSPACE}/hamlib-prefix"

    - name: Verify Hamlib prefix
      shell: msys2 {0}
      run: |
        WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
        test -f "${WORKSPACE}/hamlib-prefix/bin/libhamlib-4.dll"

    - name: Save Hamlib cache
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: hamlib-prefix
        key: ${{ steps.hamlib-cache.outputs.cache-primary-key }}
