name: "Build Linux sanitizers"
description: >-
  Build and test WSJT-X with GCC AddressSanitizer and
  UndefinedBehaviorSanitizer on Linux x86_64.

inputs:
  hamlib_branch:
    description: "Hamlib branch to build"
    required: true
  recache:
    description: "Force ccache to recompile and refresh cached objects"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Validate workflow inputs
      shell: bash
      env:
        HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
      run: .github/scripts/validate-ci-inputs.sh

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates git \
          build-essential binutils cmake gfortran ccache \
          libfftw3-dev libboost-all-dev \
          qtbase5-dev qttools5-dev qtmultimedia5-dev libqt5serialport5-dev \
          libqt5sql5-sqlite libqt5websockets5-dev \
          libqt5multimedia5-plugins \
          libusb-1.0-0-dev libudev-dev libreadline-dev \
          autoconf automake libtool pkg-config texinfo \
          python3 file xauth xvfb portaudio19-dev

    - name: Cache sanitizer objects
      uses: actions/cache@v5
      with:
        path: .ccache-sanitizers
        key: ccache-linux-x86_64-asan-ubsan-gcc-${{ github.sha }}
        restore-keys: |
          ccache-linux-x86_64-asan-ubsan-gcc-

    - name: Configure ccache
      shell: bash
      run: |
        export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache-sanitizers"
        echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache-sanitizers" >> "$GITHUB_ENV"
        echo "ccache recache: ${{ inputs.recache }}"
        if [ "${{ inputs.recache }}" = "true" ]; then
          echo "CCACHE_RECACHE=1" >> "$GITHUB_ENV"
          echo "Forcing ccache recache for this run"
        fi
        mkdir -p "${GITHUB_WORKSPACE}/.ccache-sanitizers"
        ccache --version
        ccache --zero-stats

    - name: Cache Hamlib
      id: hamlib-cache
      uses: actions/cache@v5
      with:
        path: hamlib-prefix
        key: hamlib-linux-x86_64-${{ inputs.hamlib_branch }}-host-${{ hashFiles('.github/scripts/build-hamlib-linux.sh') }}

    - name: Build Hamlib
      if: steps.hamlib-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        HAMLIB_BRANCH: ${{ inputs.hamlib_branch }}
      run: .github/scripts/build-hamlib-linux.sh "$HAMLIB_BRANCH" "${GITHUB_WORKSPACE}/hamlib-prefix"

    - name: Verify Hamlib prefix
      shell: bash
      run: test -f "${GITHUB_WORKSPACE}/hamlib-prefix/lib/libhamlib.a"

    - name: Configure sanitizer build
      shell: bash
      run: |
        cmake -S . -B wsjtx-sanitizer-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/hamlib-prefix" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DWSJT_GENERATE_DOCS=OFF \
          -DWSJT_SKIP_MANPAGES=ON \
          -DWSJT_ENABLE_TESTS=ON \
          -DWSJT_ENABLE_GUI_SMOKE_TESTS=ON \
          -DWSJT_ENABLE_ASAN_UBSAN=ON \
          -DWSJT_FORTRAN_LIBRARY_VARIANTS=OPENMP_ONLY \
          -Wno-dev

    - name: Build sanitizer targets
      shell: bash
      run: cmake --build wsjtx-sanitizer-build -j"$(nproc)"

    - name: Show ccache stats
      if: always()
      shell: bash
      run: ccache --show-stats

    - name: Verify sanitizer instrumentation
      shell: bash
      run: python3 .github/scripts/verify-sanitizer-instrumentation.py wsjtx-sanitizer-build

    - name: Prepare test scratch directory
      shell: bash
      run: mkdir -p "${GITHUB_WORKSPACE}/wsjtx-sanitizer-build/tmp"

    - name: Run tests
      id: ctest
      continue-on-error: true
      shell: bash
      working-directory: wsjtx-sanitizer-build
      env:
        # GNU Fortran internal-procedure trampolines cannot execute from ASan's fake stack.
        ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0:halt_on_error=1:abort_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        QT_QPA_PLATFORM: xcb
        TMPDIR: ${{ github.workspace }}/wsjtx-sanitizer-build/tmp
      run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --output-on-failure --output-junit ctest-results.xml

    - name: Publish test summary
      if: always() && steps.ctest.outcome != 'skipped'
      shell: bash
      working-directory: wsjtx-sanitizer-build
      run: python3 ../.github/scripts/publish-ctest-summary.py "Linux x86_64 ASan + UBSan" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: always() && steps.ctest.outcome != 'skipped'
      uses: actions/upload-artifact@v7
      with:
        name: ctest-results-linux-x86_64-asan-ubsan
        path: |
          wsjtx-sanitizer-build/ctest-results.xml
          wsjtx-sanitizer-build/Testing/Temporary/LastTest.log
        if-no-files-found: ignore

    - name: Require sanitizer tests to pass
      if: always()
      shell: bash
      run: |
        failed=false
        if [ "${{ steps.ctest.outcome }}" != "success" ]; then
          echo "::error::CTest failed under ASan+UBSan"
          failed=true
        fi
        if [ "$failed" = "true" ]; then
          exit 1
        fi
